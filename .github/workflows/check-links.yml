name: 링크 점검

on:
  schedule:
    # 매주 일요일 21:00 KST (UTC 기준 12:00)
    - cron: '0 12 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 서비스 URL 점검 및 리포트
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/check-links.mjs
      - name: 점검 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/link-check-status.json
          git diff --cached --quiet && echo "변경 없음, 커밋 생략" || git commit -m "chore: 링크 점검 결과 갱신"
          git push
